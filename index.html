<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ điểm danh 12A6</title>
</head>
<body style="margin:0;font-family:-apple-system,sans-serif;background:#0B0F14;color:#E8EEF7">
<p style="padding:24px">Đang mở sổ điểm danh…</p>
<script>
(async function(){
  const urls=[
    'https://cdn.jsdelivr.net/gh/khanhgf091/so-12a6@b5663eb07099b315115fcf2582ebda842ed80a8d/index.html',
    'https://raw.githubusercontent.com/khanhgf091/so-12a6/b5663eb07099b315115fcf2582ebda842ed80a8d/index.html'
  ];
  let html=null;
  for(const u of urls){
    try{
      const r=await fetch(u);
      if(r.ok){ html=await r.text(); break; }
    }catch(e){}
  }
  if(!html){
    document.body.innerHTML='<p style="padding:24px">Chưa tải được. Vào GitHub upload lại file index.html mới nhất.</p>';
    return;
  }
  document.open(); document.write(html); document.close();
})();
</script>
</body>
</html>
