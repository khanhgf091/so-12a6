<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sổ điểm danh 12A6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#0B0F14;--card:#151B24;--line:#243041;--text:#E8EEF7;--muted:#8B9BB0;--teal:#2DD4BF;--blue:#60A5FA;--safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
#boot{padding:24px;color:var(--muted)}
</style>
</head>
<body>
<p id="boot">Đang mở sổ điểm danh 12A6…</p>
<script>
(async function(){
  const parts=["app.part0.js","app.part1.js","app.part2.js","app.part3.js"];
  try{
    for(const p of parts){
      await new Promise((res,rej)=>{
        const s=document.createElement("script");
        s.src=p+"?v=20261006b";
        s.onload=res; s.onerror=()=>rej(new Error(p));
        document.body.appendChild(s);
      });
    }
    const b=document.getElementById("boot"); if(b) b.remove();
  }catch(e){
    document.body.innerHTML='<p style="padding:24px;color:#fff">Không tải được app. Thử tải lại trang.</p>';
  }
})();
</script>
</body>
</html>
